<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品選品 ｜ 哈拿的刺繡星球</title>

  <!-- Favicon / 品牌圖示 -->
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  <meta property="og:image" content="images/logo.png">

  <!-- Google Fonts: Plus Jakarta Sans & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- PapaParse for CSV loading -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --primary: #8b5cf6;
      --primary-dark: #7c3aed;
      --brand-brown: #5c4033;
      --brand-accent: #e07a5f;
      --bg-main: #faf9f6;
      --bg-card: #ffffff;
      --text-main: #27272a;
      --text-muted: #71717a;
      --text-light: #a1a1aa;
      --border-color: #ebe7df;
      --tag-new: #fef3c7;
      --tag-new-text: #92400e;
      --tag-stock: #dcfce7;
      --tag-stock-text: #166534;
      --tag-hot: #fee2e2;
      --tag-hot-text: #991b1b;
      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.03);
      --shadow-md: 0 8px 20px rgba(0, 0, 0, 0.06);
      --radius-md: 14px;
      --radius-lg: 20px;
      --site-max-width: 1440px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* === 公告欄 === */
    .announcement-bar {
      background: linear-gradient(90deg, #fcefe8, #fdf4f0);
      color: #9c5c42;
      font-size: 13px;
      padding: 8px 16px;
      text-align: center;
      font-weight: 500;
      border-bottom: 1px solid rgba(224, 122, 95, 0.15);
      letter-spacing: 0.3px;
    }

    /* === 頂部導覽列 === */
    .site-header {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      transition: all 0.3s ease;
    }

    .nav-container {
      max-width: var(--site-max-width);
      width: 100%;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-logo-icon {
      width: 44px;
      height: 44px;
      background: #fbf0ea;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: var(--shadow-sm);
      border: 1px solid #fae1d6;
    }

    .brand-logo-img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 2px 8px rgba(92, 64, 51, 0.12);
      border: 1.5px solid #ebdcd3;
      flex-shrink: 0;
      background: #ffffff;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .brand-area:hover .brand-logo-img {
      transform: scale(1.06);
      box-shadow: 0 4px 12px rgba(92, 64, 51, 0.18);
    }

    .brand-text h1 {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #2e2621;
      line-height: 1.2;
    }

    .brand-text p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .nav-right-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-link {
      font-size: 14px;
      font-weight: 600;
      color: #52525b;
      padding: 7px 14px;
      border-radius: 20px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-link:hover {
      color: #2e2621;
      background: #f4efe9;
    }

    .nav-link.active {
      background: #2e2621;
      color: #ffffff;
    }

    /* === 控制欄（搜尋、最愛、分類與價格篩選） === */
    .controls-container {
      max-width: var(--site-max-width);
      width: 100%;
      margin: 24px auto 20px;
      padding: 0 24px;
    }

    .search-filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 260px;
      max-width: 420px;
    }

    .search-input {
      width: 100%;
      padding: 11px 16px 11px 40px;
      border-radius: 24px;
      border: 1px solid var(--border-color);
      background: #ffffff;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: #d19a7e;
      box-shadow: 0 0 0 3px rgba(224, 122, 95, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      pointer-events: none;
    }

    .fav-filter-btn {
      padding: 8px 16px;
      background: #ffffff;
      border: 1px solid #fecdd3;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #e11d48;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .fav-filter-btn:hover { background: #fff1f2; }
    .fav-filter-btn.active {
      background: #e11d48;
      color: #ffffff;
      border-color: #e11d48;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.25);
    }

    /* 分類導覽列 */
    .category-filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
    }

    .category-nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .cat-btn {
      padding: 7px 18px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: #52525b;
      transition: all 0.2s ease;
    }
    .cat-btn:hover { background: #f7f4f0; border-color: #d4cdc5; }
    .cat-btn.active {
      background: #2e2621;
      color: #ffffff;
      border-color: #2e2621;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(46, 38, 33, 0.2);
    }

    /* === 價格區間篩選區塊 === */
    .price-filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 12px;
      margin-top: 4px;
      border-top: 1px dashed #ede8e1;
    }

    .price-pills-nav {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-label {
      font-size: 12px;
      font-weight: 600;
      color: #716358;
    }

    .price-btn {
      padding: 5px 13px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 18px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: #52525b;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .price-btn:hover { background: #f7f4f0; border-color: #d4cdc5; }
    .price-btn.active {
      background: #c2410c;
      color: #ffffff;
      border-color: #c2410c;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(194, 65, 12, 0.25);
    }

    /* 自訂價格區間輸入框群組 */
    .custom-price-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      padding: 4px 10px;
      border: 1px solid var(--border-color);
      border-radius: 18px;
    }

    .custom-price-input {
      width: 70px;
      border: none;
      outline: none;
      font-size: 12px;
      color: var(--text-main);
      background: transparent;
      text-align: center;
    }

    .custom-price-input::placeholder {
      color: var(--text-light);
    }

    .custom-price-btn {
      background: #2e2621;
      color: #ffffff;
      border: none;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .custom-price-btn:hover { background: #c2410c; }

    /* === 商品網格列表 === */
    .product-grid {
      max-width: var(--site-max-width);
      width: 100%;
      margin: 0 auto 60px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      position: relative;
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-md);
      border-color: #ded8ce;
    }

    .img-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #faf8f5;
      overflow: hidden;
    }

    .product-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
      display: block;
    }
    .product-card:hover .product-img { transform: scale(1.05); }

    .fav-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-size: 16px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .fav-btn:hover { transform: scale(1.12); background: #ffffff; }
    .fav-btn.active { color: #e11d48; }

    .product-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .tag-category-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .tag-new { background: #fef3c7; color: #92400e; }
    .tag-stock { background: #dcfce7; color: #166534; }
    .tag-hot { background: #fee2e2; color: #991b1b; }
    .tag-default { background: #f3f4f6; color: #4b5563; }

    .category-label {
      font-size: 11px;
      color: var(--text-light);
      background: #f4f2ee;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .product-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #27272a;
      display: -webkit-box;
      display: box;
      -webkit-line-clamp: 1;
      line-clamp: 1;
      -webkit-box-orient: vertical;
      box-orient: vertical;
      overflow: hidden;
    }

    .product-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 14px;
      line-height: 1.5;
      display: -webkit-box;
      display: box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      box-orient: vertical;
      overflow: hidden;
      min-height: 38px;
    }

    .price-action-row {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .product-price {
      font-weight: 700;
      color: #c2410c;
      font-size: 18px;
      display: flex;
      align-items: baseline;
      gap: 2px;
    }
    .price-currency { font-size: 12px; }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #2e2621;
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
      white-space: nowrap;
      cursor: pointer;
      border: none;
    }
    .action-btn:hover { background: #4a3d35; }
    .action-btn.favorited {
      background: #fff1f2;
      color: #e11d48;
      border: 1px solid #fecdd3;
    }

    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: #ffffff;
      border-radius: var(--radius-md);
      border: 1px dashed var(--border-color);
    }
    .status-msg-icon { font-size: 40px; margin-bottom: 12px; display: block; }

    /* === 商品詳情頁面 Detail View === */
    #detail-view {
      display: none;
      max-width: 1040px;
      margin: 16px auto 60px;
      padding: 0 24px;
      width: 100%;
    }

    .detail-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }

    .detail-top-nav {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #faf8f5;
    }

    .back-btn {
      background: transparent;
      border: none;
      font-size: 14px;
      font-weight: 600;
      color: #52525b;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
    }
    .back-btn:hover { background: #ede8e1; }

    .detail-content { display: flex; flex-direction: column; }
    @media (min-width: 768px) { .detail-content { flex-direction: row; } }

    .detail-img-box {
      flex: 1.1;
      position: relative;
      aspect-ratio: 1 / 1;
      background: #faf8f5;
      overflow: hidden;
    }
    .detail-img-box img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .detail-info-box {
      flex: 1;
      padding: 36px 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .detail-heading h1 {
      font-size: 24px;
      font-weight: 700;
      color: #27272a;
      margin: 10px 0 8px;
    }

    .detail-desc {
      font-size: 14px;
      color: #52525b;
      line-height: 1.7;
      margin-bottom: 20px;
      white-space: pre-line;
    }

    .detail-price-box {
      padding: 14px 18px;
      background: #faf8f5;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .detail-price-val { font-size: 26px; font-weight: 800; color: #c2410c; }

    .order-tips-box {
      background: #fcf6ee;
      border: 1px solid #fae6cb;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 12px;
      color: #8c5825;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .order-tips-box strong { display: block; margin-bottom: 4px; font-size: 13px; }

    .detail-cta-row { display: flex; gap: 12px; flex-direction: column; }
    .cta-primary {
      background: #2e2621;
      color: #ffffff;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      border: none;
    }
    .cta-primary:hover { background: #4a3d35; }
    .cta-primary.favorited {
      background: #fff1f2;
      color: #e11d48;
      border: 1px solid #fecdd3;
    }

    /* === 頁尾 Footer === */
    .site-footer {
      margin-top: auto;
      background: #ffffff;
      border-top: 1px solid var(--border-color);
      padding: 40px 24px 30px;
    }
    .footer-content {
      max-width: var(--site-max-width);
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 30px;
      align-items: center;
    }
    .footer-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .footer-logo-img {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #ebdcd3;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      flex-shrink: 0;
      background: #ffffff;
    }
    .footer-brand h2 {
      font-size: 18px;
      font-weight: 700;
      color: #2e2621;
      margin-bottom: 4px;
    }
    .footer-brand p {
      font-size: 13px;
      color: var(--text-muted);
    }
    .footer-copy {
      width: 100%;
      text-align: center;
      padding-top: 24px;
      margin-top: 24px;
      border-top: 1px solid #f2ede6;
      font-size: 12px;
      color: var(--text-light);
    }
  </style>
</head>
<body>

  <div class="announcement-bar">
    🧵 每一針都是用心手作・追星小物與客製刺繡選品｜歡迎加入最愛 ✨
  </div>

  <header class="site-header">
    <div class="nav-container">
      <a href="index.html" class="brand-area">
        <img src="images/logo.png" alt="哈拿的刺繡星球 Logo" class="brand-logo-img">
        <div class="brand-text">
          <h1>哈拿的刺繡星球</h1>
          <p>手工刺繡・客製配件・追星選品</p>
        </div>
      </a>
      <div class="nav-right-group">
        <nav class="nav-menu">
          <a href="index.html" class="nav-link">品牌介紹</a>
          <a href="products.html" class="nav-link active">商品選品</a>
        </nav>
      </div>
    </div>
  </header>

  <main id="list-view">
    <section class="controls-container">
      <div class="search-filter-row">
        <!-- 搜尋框 -->
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" class="search-input" placeholder="搜尋商品名稱、標籤或關鍵字..." oninput="handleSearch(this.value)">
        </div>

        <div class="right-tools-group">
          <!-- 我的最愛按鈕 -->
          <button id="toggle-fav-view" class="fav-filter-btn">
            <span>❤️</span>
            <span id="fav-btn-label">我的最愛 (0)</span>
          </button>
        </div>
      </div>

      <!-- 分類標籤導覽列 -->
      <div class="category-filter-bar">
        <div class="category-nav" id="category-nav">
          <button class="cat-btn active" onclick="setCategory('全部')">全部商品</button>
        </div>
      </div>

      <!-- 價格區間篩選按鈕列與自訂範圍 -->
      <div class="price-filter-bar">
        <div class="price-pills-nav">
          <span class="filter-label">💰 價格：</span>
          <button class="price-btn active" data-range="all" onclick="setPriceRange('all')">全部</button>
          <button class="price-btn" data-range="under200" onclick="setPriceRange('under200')">200 以下</button>
          <button class="price-btn" data-range="201-500" onclick="setPriceRange('201-500')">201–500</button>
          <button class="price-btn" data-range="above501" onclick="setPriceRange('above501')">501 以上</button>
        </div>

        <!-- 自訂價格輸入 -->
        <div class="custom-price-group">
          <input type="number" id="min-price" class="custom-price-input" placeholder="最低價">
          <span style="color:var(--text-light); font-size:12px;">-</span>
          <input type="number" id="max-price" class="custom-price-input" placeholder="最高價">
          <button class="custom-price-btn" onclick="applyCustomPrice()">篩選</button>
        </div>
      </div>
    </section>

    <!-- 商品網格 -->
    <section class="product-grid" id="product-grid">
      <div class="status-msg">
        <span class="status-msg-icon">🧵</span>
        正在從 Google 試算表載入商品資料...
      </div>
    </section>
  </main>

  <!-- 商品詳情檢視區塊 -->
  <section id="detail-view">
    <div class="detail-card">
      <div class="detail-top-nav">
        <button class="back-btn" onclick="hideDetail()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          返回商品列表
        </button>
        <span style="font-size: 13px; color: var(--text-muted);">商品詳情</span>
      </div>
      <div id="detail-container"></div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="footer-content">
      <div class="footer-brand">
        <img src="images/logo.png" alt="哈拿的刺繡星球 Logo" class="footer-logo-img">
        <div>
          <h2>哈拿的刺繡星球</h2>
          <p>用心勾勒每一次相遇 ✦ 手作刺繡・追星日常・客製禮物</p>
        </div>
      </div>
      <div class="footer-copy">
        © 2026 哈拿的刺繡星球. All rights reserved.
      </div>
    </div>
  </footer>

  <script>
    // Google 試算表發布的 CSV 網址
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTJ3LAb3l4m1BxRdcNH9UsMFXPbRwMuvSAXLbjm3XVYN8o_CVsQQQQO0YA9zgNNAXcys_5LqWdzehok/pub?output=csv";

    let productsData = [];
    let currentCategory = '全部';
    let showingOnlyFavorites = false;
    let searchQuery = '';
    let currentPriceRange = 'all'; // 'all', 'under200', '201-500', 'above501', 'custom'
    let customMinPrice = null;
    let customMaxPrice = null;

    const gridContainer = document.getElementById('product-grid');
    const categoryNav = document.getElementById('category-nav');
    const favBtnLabel = document.getElementById('fav-btn-label');

    function extractDriveId(url) {
      if (!url) return '';
      const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      return match ? match[1] : '';
    }

    function formatImageUrl(url) {
      if (!url) return '';
      url = url.trim();
      const driveId = extractDriveId(url);
      if (driveId) return `https://drive.google.com/thumbnail?id=${driveId}&sz=w1000`;
      if (url.startsWith('http://') || url.startsWith('https://')) return url;
      if (!url.startsWith('images/') && !url.startsWith('./')) return `images/${url}`;
      return url;
    }

    window.handleImageError = function(img) {
      const src = img.getAttribute('src') || '';
      if (!img.dataset.retry) {
        img.dataset.retry = '1';
        const driveId = extractDriveId(src);
        if (driveId) {
          img.src = `https://lh3.googleusercontent.com/d/${driveId}`;
        }
      }
    };

    function formatPriceHtml(price) {
      if (!price || price === '-' || String(price).trim() === '' || String(price).trim() === '洽詢') {
        return `<span class="price-inquire">私訊洽詢</span>`;
      }
      const rawStr = String(price).trim();
      if (rawStr.includes('$')) return `<span class="price-val">${rawStr}</span>`;
      const numOnly = rawStr.replace(/[^\d.]/g, '');
      if (numOnly) {
        return `<span class="price-currency">NT$</span> <span class="price-val">${Number(numOnly).toLocaleString()}</span>`;
      }
      return `<span class="price-val">${rawStr}</span>`;
    }

    function getTagClass(tag) {
      if (!tag) return '';
      if (tag.includes('新')) return 'tag-new';
      if (tag.includes('現貨')) return 'tag-stock';
      if (tag.includes('熱') || tag.includes('限')) return 'tag-hot';
      return 'tag-default';
    }

    function generateCategoryButtons() {
      const categories = [...new Set(productsData.map(p => p.category ? p.category.trim() : ''))].filter(Boolean);
      let html = `<button class="cat-btn ${currentCategory === '全部' ? 'active' : ''}" onclick="setCategory('全部')">全部商品</button>`;
      categories.forEach(cat => {
        html += `<button class="cat-btn ${currentCategory === cat ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>`;
      });
      categoryNav.innerHTML = html;
    }

    window.setCategory = function(cat) {
      currentCategory = cat;
      showingOnlyFavorites = false;
      document.getElementById('toggle-fav-view').classList.remove('active');
      generateCategoryButtons();
      renderProducts();
    };

    window.setPriceRange = function(rangeKey) {
      currentPriceRange = rangeKey;
      customMinPrice = null;
      customMaxPrice = null;
      document.getElementById('min-price').value = '';
      document.getElementById('max-price').value = '';

      document.querySelectorAll('.price-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-range') === rangeKey);
      });
      renderProducts();
    };

    window.applyCustomPrice = function() {
      const minVal = document.getElementById('min-price').value;
      const maxVal = document.getElementById('max-price').value;

      if (minVal === '' && maxVal === '') return;

      currentPriceRange = 'custom';
      customMinPrice = minVal !== '' ? parseFloat(minVal) : 0;
      customMaxPrice = maxVal !== '' ? parseFloat(maxVal) : Infinity;

      document.querySelectorAll('.price-btn').forEach(btn => btn.classList.remove('active'));
      renderProducts();
    };

    window.handleSearch = function(val) {
      searchQuery = val.trim().toLowerCase();
      renderProducts();
    };

    function getFavorites() {
      try { return JSON.parse(localStorage.getItem('my_favorites') || '[]'); }
      catch (e) { return []; }
    }

    function updateFavCountBadge() {
      const favs = getFavorites();
      if (favBtnLabel) favBtnLabel.innerText = `我的最愛 (${favs.length})`;
    }

    window.toggleFavorite = function(event, productId, fromDetail = false) {
      if (event) event.stopPropagation();
      let favs = getFavorites();
      if (favs.includes(productId)) {
        favs = favs.filter(id => id !== productId);
      } else {
        favs.push(productId);
      }
      localStorage.setItem('my_favorites', JSON.stringify(favs));
      updateFavCountBadge();
      renderProducts();
      if (fromDetail) showDetail(productId);
    };

    function renderProducts() {
      const favs = getFavorites();
      updateFavCountBadge();
      gridContainer.innerHTML = '';

      let displayProducts = productsData;

      if (currentCategory !== '全部') {
        displayProducts = displayProducts.filter(p => (p.category ? p.category.trim() : '') === currentCategory);
      }

      if (showingOnlyFavorites) {
        displayProducts = displayProducts.filter(p => favs.includes(p.id));
      }

      if (searchQuery !== '') {
        displayProducts = displayProducts.filter(p => {
          const title = (p.title || '').toLowerCase();
          const desc = (p.desc || '').toLowerCase();
          const tag = (p.tag || '').toLowerCase();
          const cat = (p.category || '').toLowerCase();
          return title.includes(searchQuery) || desc.includes(searchQuery) || tag.includes(searchQuery) || cat.includes(searchQuery);
        });
      }

      if (currentPriceRange !== 'all') {
        displayProducts = displayProducts.filter(p => {
          const raw = String(p.price || '').replace(/[^\d.]/g, '');
          const num = raw ? parseFloat(raw) : null;
          if (num === null) return false;

          if (currentPriceRange === 'under200') return num <= 200;
          if (currentPriceRange === '201-500') return num >= 201 && num <= 500;
          if (currentPriceRange === 'above501') return num >= 501;

          if (currentPriceRange === 'custom') {
            return num >= customMinPrice && num <= customMaxPrice;
          }
          return true;
        });
      }

      if (displayProducts.length === 0) {
        gridContainer.innerHTML = `
          <div class="status-msg">
            <span class="status-msg-icon">🔍</span>
            <p style="font-weight:600; font-size:16px; margin-bottom:4px;">沒有找到符合條件的商品</p>
            <p style="font-size:13px; color:var(--text-light);">請嘗試放寬價格區間、變更分類或清除搜尋關鍵字！</p>
          </div>
        `;
        return;
      }

      displayProducts.forEach(product => {
        const isFav = favs.includes(product.id);
        const imgUrl = formatImageUrl(product.img);
        const priceHtml = formatPriceHtml(product.price);
        const tagClass = getTagClass(product.tag);

        gridContainer.innerHTML += `
          <div class="product-card" onclick="showDetail('${product.id}')">
            <div class="img-container">
              <img class="product-img" src="${imgUrl}" alt="${product.title || ''}" loading="lazy" onerror="handleImageError(this)">
              <button class="fav-btn ${isFav ? 'active' : ''}" title="${isFav ? '移除最愛' : '加入最愛'}" onclick="toggleFavorite(event, '${product.id}')">
                ${isFav ? '❤️' : '🤍'}
              </button>
            </div>
            <div class="product-info">
              <div class="tag-category-row">
                ${product.tag ? `<span class="tag ${tagClass}">${product.tag}</span>` : ''}
                ${product.category ? `<span class="category-label">${product.category}</span>` : ''}
              </div>
              <h3 class="product-title">${product.title || ''}</h3>
              <p class="product-desc">${product.desc || ''}</p>
              <div class="price-action-row">
                <div class="product-price">${priceHtml}</div>
                <button class="action-btn ${isFav ? 'favorited' : ''}" onclick="toggleFavorite(event, '${product.id}')">
                  ${isFav ? '❤️ 已加入最愛' : '🤍 加入最愛'}
                </button>
              </div>
            </div>
          </div>
        `;
      });
    }

    document.getElementById('toggle-fav-view').addEventListener('click', () => {
      showingOnlyFavorites = !showingOnlyFavorites;
      const btn = document.getElementById('toggle-fav-view');
      btn.classList.toggle('active', showingOnlyFavorites);
      renderProducts();
    });

    window.showDetail = function(productId) {
      const product = productsData.find(p => p.id === productId);
      if (!product) return;
      const isFav = getFavorites().includes(product.id);
      const imgUrl = formatImageUrl(product.img);
      const priceHtml = formatPriceHtml(product.price);
      const tagClass = getTagClass(product.tag);

      document.getElementById('list-view').style.display = 'none';
      document.getElementById('detail-view').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });

      document.getElementById('detail-container').innerHTML = `
        <div class="detail-content">
          <div class="detail-img-box">
            <img src="${imgUrl}" alt="${product.title || ''}" onerror="handleImageError(this)">
            <button class="fav-btn ${isFav ? 'active' : ''}" style="top:16px; right:16px; width:44px; height:44px; font-size:20px;" onclick="toggleFavorite(event, '${product.id}', true)">
              ${isFav ? '❤️' : '🤍'}
            </button>
          </div>
          <div class="detail-info-box">
            <div>
              <div class="tag-category-row">
                ${product.tag ? `<span class="tag ${tagClass}">${product.tag}</span>` : ''}
                ${product.category ? `<span class="category-label">${product.category}</span>` : ''}
              </div>
              <h1>${product.title || ''}</h1>
              <div class="detail-desc">${product.desc || ''}</div>
            </div>
            <div class="detail-price-box">
              <span style="font-size:14px; color:var(--text-muted); font-weight:600;">商品價格</span>
              <div class="detail-price-val">${priceHtml}</div>
            </div>
            <div class="order-tips-box">
              <strong>💡 最愛提示</strong>
              點擊下方按鈕即可將此商品加入您的專屬最愛清單隨時查看！
            </div>
            <div class="detail-cta-row">
              <button class="cta-primary ${isFav ? 'favorited' : ''}" onclick="toggleFavorite(event, '${product.id}', true)">
                ${isFav ? '❤️ 已加入最愛' : '🤍 加入最愛'}
              </button>
            </div>
          </div>
        </div>
      `;
    };

    window.hideDetail = function() {
      document.getElementById('detail-view').style.display = 'none';
      document.getElementById('list-view').style.display = 'block';
    };

    function loadDataFromCSV() {
      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        transformHeader: h => h.trim(),
        complete: function(results) {
          if (results.data && results.data.length > 0) {
            productsData = results.data.filter(row => row.id && row.id.trim() !== "");
            generateCategoryButtons();
            renderProducts();
          }
        },
        error: function(err) {
          console.error("載入 CSV 失敗", err);
          gridContainer.innerHTML = `<div class="status-msg">⚠️ 無法載入 Google 試算表資料，請確認網址是否正確。</div>`;
        }
      });
    }

    loadDataFromCSV();
    updateFavCountBadge();
  </script>
</body>
</html>
