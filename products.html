<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品選品 ｜ 哈拿的刺繡星球</title>

  <!-- Favicon / 品牌圖示 -->
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  <meta property="og:image" content="images/logo.png">

  <!-- Google Fonts: Plus Jakarta Sans & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- PapaParse for CSV loading -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --primary: #8b5cf6;
      --primary-dark: #7c3aed;
      --brand-brown: #5c4033;
      --brand-accent: #e07a5f;
      --bg-main: #faf9f6;
      --bg-card: #ffffff;
      --text-main: #27272a;
      --text-muted: #71717a;
      --text-light: #a1a1aa;
      --border-color: #ebe7df;
      --tag-new: #fef3c7;
      --tag-new-text: #92400e;
      --tag-stock: #dcfce7;
      --tag-stock-text: #166534;
      --tag-hot: #fee2e2;
      --tag-hot-text: #991b1b;
      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.03);
      --shadow-md: 0 8px 20px rgba(0, 0, 0, 0.06);
      --radius-md: 14px;
      --radius-lg: 20px;
      --site-max-width: 1440px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      max-width: 100%;
      overflow-x: hidden;
      width: 100%;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* === 公告欄 === */
    .announcement-bar {
      background: linear-gradient(90deg, #fcefe8, #fdf4f0);
      color: #9c5c42;
      font-size: 12.5px;
      padding: 8px 14px;
      text-align: center;
      font-weight: 500;
      border-bottom: 1px solid rgba(224, 122, 95, 0.15);
      letter-spacing: 0.2px;
      line-height: 1.45;
    }

    /* === 頂部導覽列 === */
    .site-header {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      transition: all 0.3s ease;
      width: 100%;
    }

    .nav-container {
      max-width: var(--site-max-width);
      width: 100%;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      min-width: 0;
    }

    .brand-logo-img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 2px 8px rgba(92, 64, 51, 0.12);
      border: 1.5px solid #ebdcd3;
      flex-shrink: 0;
      background: #ffffff;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .brand-area:hover .brand-logo-img {
      transform: scale(1.06);
      box-shadow: 0 4px 12px rgba(92, 64, 51, 0.18);
    }

    .brand-text {
      min-width: 0;
    }

    .brand-text h1 {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #2e2621;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-text p {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 桌面版導覽群組 */
    .nav-right-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-link {
      font-size: 14px;
      font-weight: 600;
      color: #52525b;
      padding: 7px 14px;
      border-radius: 20px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .nav-link:hover {
      color: #2e2621;
      background: #f4efe9;
    }

    .nav-link.active {
      background: #2e2621;
      color: #ffffff;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
      cursor: pointer;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .social-btn.ig {
      background: #fdf2f4;
      color: #d82b6b;
      border-color: #fbd6df;
    }
    .social-btn.ig:hover { background: #fae1e7; }

    .social-btn.threads {
      background: #f4f4f5;
      color: #18181b;
      border-color: #e4e4e7;
    }
    .social-btn.threads:hover { background: #e4e4e7; color: #000000; }

    .social-btn.line {
      background: #f0fdf4;
      color: #16a34a;
      border-color: #dcfce7;
    }
    .social-btn.line:hover { background: #dcfce7; }

    .social-btn.email {
      background: #fef2f2;
      color: #ea4335;
      border-color: #fee2e2;
    }
    .social-btn.email:hover { background: #fee2e2; }

    .social-btn svg,
    .social-btn img {
      width: 15px;
      height: 15px;
      fill: currentColor;
      object-fit: contain;
      flex-shrink: 0;
    }

    /* 手機版頂部右側社群按鈕 */
    .mobile-header-social {
      display: none;
      align-items: center;
      gap: 6px;
    }

    .mob-social-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
      border: 1px solid transparent;
      flex-shrink: 0;
    }
    .mob-social-btn:hover { transform: scale(1.08); }
    .mob-social-btn svg,
    .mob-social-btn img {
      width: 16px;
      height: 16px;
      fill: currentColor;
      object-fit: contain;
      flex-shrink: 0;
    }

    .mob-social-btn.ig {
      background: #fdf2f4;
      color: #d82b6b;
      border-color: #fbd6df;
    }
    .mob-social-btn.threads {
      background: #f4f4f5;
      color: #18181b;
      border-color: #e4e4e7;
    }
    .mob-social-btn.line {
      background: #f0fdf4;
      color: #16a34a;
      border-color: #dcfce7;
    }
    .mob-social-btn.email {
      background: #fef2f2;
      color: #ea4335;
      border-color: #fee2e2;
    }

    /* 手機版次級分頁導覽列 (Sticky tabs) */
    .mobile-subnav {
      display: none;
      background: #ffffff;
      border-top: 1px solid #f2ede6;
      padding: 6px 14px 8px;
      gap: 8px;
      width: 100%;
    }

    .mobile-subnav-link {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 600;
      color: #61564f;
      background: #f7f4ef;
      transition: all 0.2s ease;
      text-align: center;
      text-decoration: none;
    }

    .mobile-subnav-link.active {
      background: #2e2621;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(46, 38, 33, 0.16);
    }

    /* === 控制欄（搜尋、最愛、分類與價格篩選） === */
    .controls-container {
      max-width: var(--site-max-width);
      width: 100%;
      margin: 16px auto 14px;
      padding: 0 14px;
    }

    @media (min-width: 769px) {
      .controls-container {
        margin: 24px auto 20px;
        padding: 0 24px;
      }
    }

    .search-filter-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    .search-input {
      width: 100%;
      height: 42px;
      padding: 0 14px 0 38px;
      border-radius: 22px;
      border: 1px solid var(--border-color);
      background: #ffffff;
      font-size: 16px; /* 16px prevents iOS auto zoom */
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }

    .search-input:focus {
      border-color: #d19a7e;
      box-shadow: 0 0 0 3px rgba(224, 122, 95, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      object-fit: contain;
      pointer-events: none;
    }

    .fav-filter-btn {
      height: 42px;
      padding: 0 14px;
      background: #ffffff;
      border: 1px solid #fecdd3;
      border-radius: 22px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #e11d48;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }
    .fav-filter-btn:hover { background: #fff1f2; }
    .fav-filter-btn.active {
      background: #fff1f2;
      color: #e11d48;
      border-color: #e11d48;
      box-shadow: 0 3px 10px rgba(225, 29, 72, 0.2);
    }

    /* 分類導覽列 - 手機版橫向滑動 */
    .category-filter-bar {
      display: flex;
      align-items: center;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 2px 0 8px;
      margin-bottom: 6px;
    }
    .category-filter-bar::-webkit-scrollbar {
      display: none;
    }

    .category-nav {
      display: flex;
      gap: 8px;
      flex-wrap: nowrap;
    }

    .cat-btn {
      padding: 6px 16px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: #52525b;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .cat-btn:hover { background: #f7f4f0; border-color: #d4cdc5; }
    .cat-btn.active {
      background: #2e2621;
      color: #ffffff;
      border-color: #2e2621;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(46, 38, 33, 0.16);
    }

    /* === 價格區間篩選區塊 === */
    .price-filter-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 10px;
      margin-top: 4px;
      border-top: 1px dashed #ede8e1;
    }
    @media (min-width: 769px) {
      .price-filter-bar {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .price-pills-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      white-space: nowrap;
    }
    .price-pills-nav::-webkit-scrollbar {
      display: none;
    }

    .filter-label {
      font-size: 12px;
      font-weight: 600;
      color: #716358;
      flex-shrink: 0;
    }

    .price-btn {
      flex-shrink: 0;
      padding: 5px 12px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: #52525b;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .price-btn:hover { background: #f7f4f0; border-color: #d4cdc5; }
    .price-btn.active {
      background: #c2410c;
      color: #ffffff;
      border-color: #c2410c;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(194, 65, 12, 0.2);
    }

    /* 自訂價格區間輸入框群組 */
    .custom-price-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      padding: 4px 10px;
      border: 1px solid var(--border-color);
      border-radius: 18px;
      width: 100%;
      max-width: 280px;
    }

    .custom-price-input {
      width: 65px;
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      font-size: 13px;
      color: var(--text-main);
      background: transparent;
      text-align: center;
    }

    .custom-price-input::placeholder {
      color: var(--text-light);
      font-size: 12px;
    }

    .custom-price-btn {
      background: #2e2621;
      color: #ffffff;
      border: none;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      flex-shrink: 0;
    }
    .custom-price-btn:hover { background: #c2410c; }

    /* === 商品網格列表 === */
    .product-grid {
      max-width: var(--site-max-width);
      width: 100%;
      margin: 0 auto 50px;
      padding: 0 12px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 640px) {
      .product-grid {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 20px;
        padding: 0 20px;
      }
    }

    @media (min-width: 1024px) {
      .product-grid {
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 24px;
        padding: 0 24px;
        margin-bottom: 60px;
      }
    }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      position: relative;
    }
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: #ded8ce;
    }

    .img-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #faf8f5;
      overflow: hidden;
    }

    .product-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
      display: block;
    }
    .product-card:hover .product-img { transform: scale(1.05); }

    .product-info {
      padding: 10px 10px 12px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    @media (min-width: 640px) {
      .product-info {
        padding: 16px;
      }
    }

    .tag-category-row {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .tag-new { background: #fef3c7; color: #92400e; }
    .tag-stock { background: #dcfce7; color: #166534; }
    .tag-hot { background: #fee2e2; color: #991b1b; }
    .tag-default { background: #f3f4f6; color: #4b5563; }

    .category-label {
      font-size: 10px;
      color: var(--text-light);
      background: #f4f2ee;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .product-title {
      font-size: 13.5px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #27272a;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    @media (min-width: 640px) {
      .product-title {
        font-size: 16px;
        margin-bottom: 6px;
      }
    }

    .product-desc {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    @media (min-width: 640px) {
      .product-desc {
        font-size: 13px;
        margin-bottom: 14px;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        min-height: 38px;
      }
    }

    .price-action-row {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .product-price {
      font-weight: 700;
      color: #c2410c;
      font-size: 15px;
      display: flex;
      align-items: baseline;
      gap: 2px;
      white-space: nowrap;
    }
    @media (min-width: 640px) {
      .product-price {
        font-size: 18px;
      }
    }

    .price-currency { font-size: 11px; }

    .btn-icon {
      width: 15px;
      height: 15px;
      object-fit: contain;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }
    @media (min-width: 640px) {
      .btn-icon {
        width: 17px;
        height: 17px;
      }
    }

    .btn-icon-lg {
      width: 20px;
      height: 20px;
      object-fit: contain;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .announcement-icon {
      width: 16px;
      height: 16px;
      object-fit: contain;
      vertical-align: -2px;
      margin-right: 4px;
      display: inline-block;
    }

    .btn-inline-icon {
      width: 18px;
      height: 18px;
      object-fit: contain;
      vertical-align: middle;
      display: inline-block;
      flex-shrink: 0;
    }

    .tips-inline-icon {
      width: 16px;
      height: 16px;
      object-fit: contain;
      vertical-align: -2px;
      margin-right: 4px;
      display: inline-block;
      mix-blend-mode: multiply;
    }

    .empty-icon-img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      display: inline-block;
      opacity: 0.85;
    }

    .loading-icon {
      width: 46px;
      height: 46px;
      object-fit: contain;
      display: inline-block;
      animation: gentle-pulse 2s ease-in-out infinite;
    }
    @keyframes gentle-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: #faf8f5;
      color: #2e2621;
      border: 1px solid #ded8ce;
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      transition: all 0.2s ease;
      white-space: nowrap;
      cursor: pointer;
    }
    @media (min-width: 640px) {
      .action-btn {
        padding: 7px 13px;
        font-size: 13px;
      }
    }
    .action-btn:hover {
      background: #f2ece3;
      border-color: #cfc6b8;
    }
    .action-btn.favorited {
      background: #fff1f2;
      color: #e11d48;
      border: 1px solid #fecdd3;
    }
    .action-btn.favorited:hover {
      background: #ffe4e6;
    }

    .btn-text-short { display: inline; }
    .btn-text-full { display: none; }
    @media (min-width: 640px) {
      .btn-text-short { display: none; }
      .btn-text-full { display: inline; }
    }

    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: #ffffff;
      border-radius: var(--radius-md);
      border: 1px dashed var(--border-color);
    }
    .status-msg-icon { font-size: 40px; margin-bottom: 12px; display: block; }

    /* === 商品詳情頁面 Detail View === */
    #detail-view {
      display: none;
      max-width: 1040px;
      margin: 12px auto 50px;
      padding: 0 12px;
      width: 100%;
    }
    @media (min-width: 769px) {
      #detail-view {
        margin: 16px auto 60px;
        padding: 0 24px;
      }
    }

    .detail-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }

    .detail-top-nav {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #faf8f5;
    }
    @media (min-width: 769px) {

  <script>
    // Google 試算表發布的 CSV 網址
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTJ3LAb3l4m1BxRdcNH9UsMFXPbRwMuvSAXLbjm3XVYN8o_CVsQQQQO0YA9zgNNAXcys_5LqWdzehok/pub?output=csv";

    let productsData = [];
    let currentCategory = '全部';
    let showingOnlyFavorites = false;
    let searchQuery = '';
    let currentPriceRange = 'all'; // 'all', 'under200', '201-500', 'above501', 'custom'
    let customMinPrice = null;
    let customMaxPrice = null;

    const gridContainer = document.getElementById('product-grid');
    const categoryNav = document.getElementById('category-nav');
    const favBtnLabel = document.getElementById('fav-btn-label');

    function extractDriveId(url) {
      if (!url) return '';
      const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      return match ? match[1] : '';
    }

    function formatImageUrl(url) {
      if (!url) return '';
      url = url.trim();
      const driveId = extractDriveId(url);
      if (driveId) return `https://drive.google.com/thumbnail?id=${driveId}&sz=w1000`;
      if (url.startsWith('http://') || url.startsWith('https://')) return url;
      if (!url.startsWith('images/') && !url.startsWith('./')) return `images/${url}`;
      return url;
    }

    window.handleImageError = function(img) {
      const src = img.getAttribute('src') || '';
      if (!img.dataset.retry) {
        img.dataset.retry = '1';
        const driveId = extractDriveId(src);
        if (driveId) {
          img.src = `https://lh3.googleusercontent.com/d/${driveId}`;
        }
      }
    };

    function formatPriceHtml(price) {
      if (!price || price === '-' || String(price).trim() === '' || String(price).trim() === '洽詢') {
        return `<span class="price-inquire">私訊洽詢</span>`;
      }
      const rawStr = String(price).trim();
      if (rawStr.includes('$')) return `<span class="price-val">${rawStr}</span>`;
      const numOnly = rawStr.replace(/[^\d.]/g, '');
      if (numOnly) {
        return `<span class="price-currency">NT$</span> <span class="price-val">${Number(numOnly).toLocaleString()}</span>`;
      }
      return `<span class="price-val">${rawStr}</span>`;
    }

    function getTagClass(tag) {
      if (!tag) return '';
      if (tag.includes('新')) return 'tag-new';
      if (tag.includes('現貨')) return 'tag-stock';
      if (tag.includes('熱') || tag.includes('限')) return 'tag-hot';
      return 'tag-default';
    }

    function generateCategoryButtons() {
      const categories = [...new Set(productsData.map(p => p.category ? p.category.trim() : ''))].filter(Boolean);
      let html = `<button class="cat-btn ${currentCategory === '全部' ? 'active' : ''}" onclick="setCategory('全部')">全部商品</button>`;
      categories.forEach(cat => {
        html += `<button class="cat-btn ${currentCategory === cat ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>`;
      });
      categoryNav.innerHTML = html;
    }

    window.setCategory = function(cat) {
      currentCategory = cat;
      showingOnlyFavorites = false;
      document.getElementById('toggle-fav-view').classList.remove('active');
      generateCategoryButtons();
      renderProducts();
    };

    window.setPriceRange = function(rangeKey) {
      currentPriceRange = rangeKey;
      customMinPrice = null;
      customMaxPrice = null;
      document.getElementById('min-price').value = '';
      document.getElementById('max-price').value = '';

      document.querySelectorAll('.price-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-range') === rangeKey);
      });
      renderProducts();
    };

    window.applyCustomPrice = function() {
      const minVal = document.getElementById('min-price').value;
      const maxVal = document.getElementById('max-price').value;

      if (minVal === '' && maxVal === '') return;

      currentPriceRange = 'custom';
      customMinPrice = minVal !== '' ? parseFloat(minVal) : 0;
      customMaxPrice = maxVal !== '' ? parseFloat(maxVal) : Infinity;

      document.querySelectorAll('.price-btn').forEach(btn => btn.classList.remove('active'));
      renderProducts();
    };

    window.handleSearch = function(val) {
      searchQuery = val.trim().toLowerCase();
      renderProducts();
    };

    function getFavorites() {
      try { return JSON.parse(localStorage.getItem('my_favorites') || '[]'); }
      catch (e) { return []; }
    }

    function updateFavCountBadge() {
      const favs = getFavorites();
      const countEl = document.getElementById('fav-count');
      if (countEl) {
        countEl.innerText = `(${favs.length})`;
      } else if (favBtnLabel) {
        favBtnLabel.innerText = `我的最愛 (${favs.length})`;
      }
      const icon = document.getElementById('fav-filter-icon');
      if (icon) {
        icon.src = (showingOnlyFavorites || favs.length > 0) ? 'icon/收藏.PNG' : 'icon/待收藏.PNG';
      }
    }

    window.toggleFavorite = function(event, productId, fromDetail = false) {
      if (event) event.stopPropagation();
      let favs = getFavorites();
      if (favs.includes(productId)) {
        favs = favs.filter(id => id !== productId);
      } else {
        favs.push(productId);
      }
      localStorage.setItem('my_favorites', JSON.stringify(favs));
      updateFavCountBadge();
      renderProducts();
      if (fromDetail) showDetail(productId);
    };

    function renderProducts() {
      const favs = getFavorites();
      updateFavCountBadge();
      gridContainer.innerHTML = '';

      let displayProducts = productsData;

      if (currentCategory !== '全部') {
        displayProducts = displayProducts.filter(p => (p.category ? p.category.trim() : '') === currentCategory);
      }

      if (showingOnlyFavorites) {
        displayProducts = displayProducts.filter(p => favs.includes(p.id));
      }

      if (searchQuery !== '') {
        displayProducts = displayProducts.filter(p => {
          const title = (p.title || '').toLowerCase();
          const desc = (p.desc || '').toLowerCase();
          const tag = (p.tag || '').toLowerCase();
          const cat = (p.category || '').toLowerCase();
          return title.includes(searchQuery) || desc.includes(searchQuery) || tag.includes(searchQuery) || cat.includes(searchQuery);
        });
      }

      if (currentPriceRange !== 'all') {
        displayProducts = displayProducts.filter(p => {
          const raw = String(p.price || '').replace(/[^\d.]/g, '');
          const num = raw ? parseFloat(raw) : null;
          if (num === null) return false;

          if (currentPriceRange === 'under200') return num <= 200;
          if (currentPriceRange === '201-500') return num >= 201 && num <= 500;
          if (currentPriceRange === 'above501') return num >= 501;

          if (currentPriceRange === 'custom') {
            return num >= customMinPrice && num <= customMaxPrice;
          }
          return true;
        });
      }

      if (displayProducts.length === 0) {
        gridContainer.innerHTML = `
          <div class="status-msg">
            <span class="status-msg-icon">
              <img src="icon/搜尋.PNG" alt="搜尋無結果" class="empty-icon-img">
            </span>
            <p style="font-weight:600; font-size:16px; margin-bottom:4px;">沒有找到符合條件的商品</p>
            <p style="font-size:13px; color:var(--text-light);">請嘗試放寬價格區間、變更分類或清除搜尋關鍵字！</p>
          </div>
        `;
        return;
      }

      displayProducts.forEach(product => {
        const isFav = favs.includes(product.id);
        const imgUrl = formatImageUrl(product.img);
        const priceHtml = formatPriceHtml(product.price);
        const tagClass = getTagClass(product.tag);

        gridContainer.innerHTML += `
          <div class="product-card" onclick="showDetail('${product.id}')">
            <div class="img-container">
              <img class="product-img" src="${imgUrl}" alt="${product.title || ''}" loading="lazy" onerror="handleImageError(this)">
            </div>
            <div class="product-info">
              <div class="tag-category-row">
                ${product.tag ? `<span class="tag ${tagClass}">${product.tag}</span>` : ''}
                ${product.category ? `<span class="category-label">${product.category}</span>` : ''}
              </div>
              <h3 class="product-title">${product.title || ''}</h3>
              <p class="product-desc">${product.desc || ''}</p>
              <div class="price-action-row">
                <div class="product-price">${priceHtml}</div>
                <button class="action-btn ${isFav ? 'favorited' : ''}" onclick="toggleFavorite(event, '${product.id}')" title="${isFav ? '已加入最愛' : '加入最愛'}">
                  <img src="${isFav ? 'icon/收藏.PNG' : 'icon/待收藏.PNG'}" class="btn-icon" alt="${isFav ? '已收藏' : '加入最愛'}">
                  <span class="btn-text-full">${isFav ? '已加入最愛' : '加入最愛'}</span>
                  <span class="btn-text-short">${isFav ? '已加入' : '收藏'}</span>
                </button>
              </div>
            </div>
          </div>
        `;
      });
    }

    document.getElementById('toggle-fav-view').addEventListener('click', () => {
      showingOnlyFavorites = !showingOnlyFavorites;
      const btn = document.getElementById('toggle-fav-view');
      btn.classList.toggle('active', showingOnlyFavorites);
      renderProducts();
    });

    window.showDetail = function(productId) {
      const product = productsData.find(p => p.id === productId);
      if (!product) return;
      const isFav = getFavorites().includes(product.id);
      const imgUrl = formatImageUrl(product.img);
      const priceHtml = formatPriceHtml(product.price);
      const tagClass = getTagClass(product.tag);

      document.getElementById('list-view').style.display = 'none';
      document.getElementById('detail-view').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });

      document.getElementById('detail-container').innerHTML = `
        <div class="detail-content">
          <div class="detail-img-box">
            <img src="${imgUrl}" alt="${product.title || ''}" onerror="handleImageError(this)">
          </div>
          <div class="detail-info-box">
            <div>
              <div class="tag-category-row">
                ${product.tag ? `<span class="tag ${tagClass}">${product.tag}</span>` : ''}
                ${product.category ? `<span class="category-label">${product.category}</span>` : ''}
              </div>
              <h1>${product.title || ''}</h1>
              <div class="detail-desc">${product.desc || ''}</div>
            </div>
            <div class="detail-price-box">
              <span style="font-size:14px; color:var(--text-muted); font-weight:600;">商品價格</span>
              <div class="detail-price-val">${priceHtml}</div>
            </div>
            <div class="order-tips-box">
              <strong><img src="icon/燈泡.jpg" class="tips-inline-icon" alt="說明"> 訂購與詢價說明</strong>
              每一件作品皆為用心手作刺繡，單筆滿 $1,500 即享免運費！可點擊下方按鈕加入最愛清單隨時查看，或直接私訊 Instagram 向店長訂購與詢問現貨！
            </div>
            <div class="detail-cta-row">
              <button class="cta-primary ${isFav ? 'favorited' : ''}" onclick="toggleFavorite(event, '${product.id}', true)">
                <img src="${isFav ? 'icon/收藏.PNG' : 'icon/待收藏.PNG'}" class="btn-icon-lg" alt="${isFav ? '已收藏' : '加入最愛'}">
                <span>${isFav ? '已在我的最愛清單中' : '加入我的最愛'}</span>
              </button>
              <a href="${BRAND_CONFIG.instagramUrl}" target="_blank" class="cta-inquire">
                <img src="icon/instagram.svg" class="btn-inline-icon" alt="Instagram">
                <span>私訊 Instagram 詢問或訂購</span>
              </a>
            </div>
          </div>
        </div>
      `;
    };

    window.hideDetail = function() {
      document.getElementById('detail-view').style.display = 'none';
      document.getElementById('list-view').style.display = 'block';
    };

    function loadDataFromCSV() {
      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        transformHeader: h => h.trim(),
        complete: function(results) {
          if (results.data && results.data.length > 0) {
            productsData = results.data.filter(row => row.id && row.id.trim() !== "");
            generateCategoryButtons();
            renderProducts();
          }
        },
        error: function(err) {
          console.error("載入 CSV 失敗", err);
          gridContainer.innerHTML = `<div class="status-msg">無法載入 Google 試算表資料，請確認網路連線或試算表發布設定。</div>`;
        }
      });
    }

    // 品牌與社群基本設定
    const BRAND_CONFIG = {
      brandName: "哈拿的刺繡星球",
      brandSubtitle: "寵物小物・客製配件・追星選品",
      instagramUrl: "https://instagram.com/",
      threadsUrl: "https://www.threads.net/",
      lineUrl: "https://line.me/",
      email: "hana.embroidery@gmail.com",
    };

    const updateLink = (id, url) => {
      const el = document.getElementById(id);
      if (el && url) el.href = url;
    };

    // 套用社群超連結
    updateLink('nav-ig-link', BRAND_CONFIG.instagramUrl);
    updateLink('nav-threads-link', BRAND_CONFIG.threadsUrl);
    updateLink('nav-line-link', BRAND_CONFIG.lineUrl);
    updateLink('nav-email-link', `mailto:${BRAND_CONFIG.email}`);

    updateLink('mob-nav-ig-link', BRAND_CONFIG.instagramUrl);
    updateLink('mob-nav-threads-link', BRAND_CONFIG.threadsUrl);
    updateLink('mob-nav-line-link', BRAND_CONFIG.lineUrl);
    updateLink('mob-nav-email-link', `mailto:${BRAND_CONFIG.email}`);

    updateLink('footer-ig-link', BRAND_CONFIG.instagramUrl);
    updateLink('footer-threads-link', BRAND_CONFIG.threadsUrl);
    updateLink('footer-line-link', BRAND_CONFIG.lineUrl);
    updateLink('footer-email-link', `mailto:${BRAND_CONFIG.email}`);

    loadDataFromCSV();
    updateFavCountBadge();
  </script>
</body>
</html>
